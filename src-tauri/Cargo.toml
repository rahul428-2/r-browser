[package]
name = "r-browser"
version = "0.1.6"
description = "Open-source, security-first browser"
license = "MPL-2.0"
edition = "2021"

[lib]
name = "rbrowser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "macos-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
aes-gcm = { version = "0.10", features = ["zeroize"] }
zeroize = { version = "1", features = ["derive"] }
csv = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "content-blocking"] }
psl = "2"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
tokio = { version = "1", features = ["net", "io-util", "time"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSArray", "NSURL", "NSURLRequest", "NSDate", "NSSet"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }
block2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "WKContentRuleList", "WKContentRuleListStore", "WKUserContentController", "WKWebsiteDataStore", "WKWebsiteDataRecord"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Same versions Tauri uses, so its WebView2 controller and window handle types are ours too.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
