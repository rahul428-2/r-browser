[package]
name = "r-browser"
version = "0.1.0"
description = "Open-source, security-first browser"
license = "MPL-2.0"
edition = "2021"

[lib]
name = "rbrowser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
