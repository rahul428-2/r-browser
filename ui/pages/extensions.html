<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Extensions</title>
  <link rel="stylesheet" href="page.css">
  <style>
    .soon { text-align: center; padding: 72px 24px; border: 1px solid var(--line); border-radius: 16px; background: var(--well); }
    .soon svg { width: 44px; height: 44px; fill: none; stroke: var(--glint); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

    a { color: var(--glint); }

</head>
<body>
  <header><h1>Extensions</h1></header>

    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3.5h3.5v3a1.75 1.75 0 1 0 3.5 0v-3h4.5V8h-3a1.75 1.75 0 1 0 0 3.5h3V20.5H16v-3a1.75 1.75 0 1 0-3.5 0v3H3.5V16h3a1.75 1.75 0 1 0 0-3.5h-3V3.5z"/></svg>
    <h2>Extensions are coming</h2>
    <p>R-Browser already has an ad and tracker blocker, a pop-up blocker and a password manager built in, so you don't need extensions for those.</p>
    <p>Want a particular extension? <a href="https://github.com/rahul428-2/r-browser/issues">Tell us on GitHub</a>.</p>

</html>
