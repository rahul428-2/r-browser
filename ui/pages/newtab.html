<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New tab</title>
  <style>
    :root { --abyss: #070b14; --well: #0f1726; --ice: #dce6f5; --fog: #7d8ba3; --signal: #3b9eff; --glint: #7fe3ff; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; background: radial-gradient(ellipse 70% 55% at 50% 38%, #0d1a33 0%, var(--abyss) 70%);
      color: var(--ice); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif; -webkit-font-smoothing: antialiased; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 28px; padding: 0 16px 12vh; }
    /* the wolf's black backdrop blends into the page, so only the glowing mark shows */
    .mark { width: 210px; height: 210px; margin-bottom: -18px; }
    .mark img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: lighten; }
    h1 { font-size: 30px; font-weight: 600; letter-spacing: -.3px; }
    form { width: min(620px, 100%); display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 20px;
      background: var(--well); border: 1px solid #1d2a40; border-radius: 26px;
      transition: border-color .15s, box-shadow .15s; }
    form:focus-within { border-color: var(--signal); box-shadow: 0 0 0 4px #3b9eff22, 0 0 24px #7fe3ff1a; }
    svg { width: 19px; height: 19px; fill: none; stroke: var(--fog); stroke-width: 1.8; stroke-linecap: round; flex: none; }
    input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--ice);
      font: inherit; font-size: 17px; caret-color: var(--glint); }
    input::placeholder { color: #5b6880; }
    @media (prefers-reduced-motion: no-preference) {
      .mark { animation: wake 900ms cubic-bezier(.2,.7,.2,1) both; }
      @keyframes wake { from { opacity: 0; transform: scale(.96); } }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark"><img src="../wolf.png" alt=""></div>
    <h1>R-Browser</h1>
    <form id="f" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="q" autofocus spellcheck="false" autocomplete="off" placeholder="Search Google or type a web address" aria-label="Search or address">
    </form>
  </main>
  <script>
    // Same rules as the URL bar (core/omnibox.rs): domain-looking input opens the site, anything else searches Google.
    document.getElementById("f").addEventListener("submit", (e) => {
      e.preventDefault();
      const s = document.getElementById("q").value.trim();
      if (!s) return;
      const host = s.split(/[/?#]/)[0].split(":")[0];
      const local = host === "localhost" || /^\d+\.\d+\.\d+\.\d+$/.test(host);
      const looksLikeUrl = /^https?:\/\//.test(s) || (!/\s/.test(s) && (local || (host.includes(".") && !host.startsWith(".") && !host.endsWith("."))));
      location.href = looksLikeUrl ? (/^https?:\/\//.test(s) ? s : (local ? "http://" : "https://") + s)
                                   : "https://www.google.com/search?q=" + encodeURIComponent(s).replace(/%20/g, "+");
    });
  </script>
</body>
</html>
