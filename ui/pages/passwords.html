<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Passwords</title>
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <header>
    <h1>Passwords</h1>
    <input class="search" id="q" type="search" placeholder="Search passwords" aria-label="Search passwords">
    <button class="text" id="import" title="Import a CSV exported from passwords.google.com">Import from Google</button>
  </header>
  <p class="note">Encrypted on this device with AES-256. The key lives in your macOS Keychain, and Touch ID or your laptop password unlocks it for 5 minutes.</p>
  <p class="note" id="msg" role="status"></p>
  <main id="list"></main>
  <script>
    const { invoke } = window.__TAURI__.core;
    const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const host = (o) => { try { return new URL(o).host.replace(/^www\./, ""); } catch { return o; } };
    const msg = (t) => { document.getElementById("msg").textContent = t; };
    let all = null;

    async function load() {
      try { all = await invoke("passwords_list"); msg(""); }
      catch (e) {
        all = null;
        const list = document.getElementById("list");
        const b = el("button", "text", "Unlock");
        b.onclick = load;
        list.replaceChildren(el("p", "empty", e === "locked" ? "Locked. Unlock with Touch ID or your laptop password." : String(e)), b);
        return;
      }
      render();
    }

    function render() {
      if (!all) return;
      const q = document.getElementById("q").value.trim().toLowerCase();
      const rows = all.filter((p) => !q || p.origin.toLowerCase().includes(q) || p.username.toLowerCase().includes(q));
      const list = document.getElementById("list");
      list.replaceChildren();
      if (!rows.length) {
        list.append(el("p", "empty", q ? "No passwords match that search." : "No saved passwords yet. Log in to a site and choose Save, or import from Google."));
        return;
      }
      for (const p of rows) {
        const row = el("div", "row");
        const main = el("div", "main");
        main.append(el("div", "title", host(p.origin)), el("div", "sub", p.username || "(no username)"));
        const secret = el("code", "secret", "••••••••");
        const show = el("button", "text", "Show");
        show.onclick = async () => {
          if (show.dataset.pw != null) {
            // copy: synchronous, inside the click, so the clipboard accepts it
            const ta = el("textarea"); ta.value = show.dataset.pw; document.body.append(ta); ta.select();
            document.execCommand("copy"); ta.remove();
            show.textContent = "Copied"; setTimeout(() => { show.textContent = "Copy"; }, 1500);
            return;
          }
          try { show.dataset.pw = await invoke("password_reveal", { origin: p.origin, username: p.username }); }
          catch (e) { msg(String(e)); return; }
          secret.textContent = show.dataset.pw;
          show.textContent = "Copy";
          setTimeout(() => { delete show.dataset.pw; secret.textContent = "••••••••"; show.textContent = "Show"; }, 30000);
        };
        const del = el("button", "text danger", "Delete");
        del.onclick = async () => {
          if (del.textContent !== "Sure?") { del.textContent = "Sure?"; setTimeout(() => { del.textContent = "Delete"; }, 3000); return; }
          try { await invoke("password_delete", { origin: p.origin, username: p.username }); } catch (e) { msg(String(e)); }
          load();
        };
        row.append(el("span", "mono", (host(p.origin)[0] || "?").toUpperCase()), main, secret, show, del);
        list.append(row);
      }
    }

    document.getElementById("q").addEventListener("input", render);
    document.getElementById("import").onclick = async () => {
      try { const n = await invoke("passwords_import"); if (n) msg(`Imported ${n} passwords.`); }
      catch (e) { msg(String(e)); }
      load();
    };
    load();
  </script>
</body>
</html>
